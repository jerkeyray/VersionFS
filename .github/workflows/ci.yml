name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config fuse3 libfuse3-dev libsqlite3-dev libssl-dev git python3 python3-venv nodejs npm
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVERSIONFS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      # The mounted suites are what caught the libfuse 3.14 build break, the O_WRONLY EIO, and
      # the fstat ENOENT; unit tests alone never exercised the FUSE daemon.
      - name: Mounted integration test
        run: bash scripts/integration_test.sh ./build/versionfs ./build/versionfsctl
      - name: Recovery comparison (git vs snapshot vs session undo)
        run: bash scripts/recovery_comparison.sh ./build/versionfs ./build/versionfsctl
      - name: Real-tools session trial (git, pip, npm, cc under one session, then undo)
        run: bash scripts/real_tools_test.sh ./build/versionfs ./build/versionfsctl
      - name: Fault-injection build
        run: |
          cmake -S . -B build-faults -DCMAKE_BUILD_TYPE=Release -DVERSIONFS_ENABLE_FAULT_INJECTION=ON
          cmake --build build-faults --parallel
      - name: Crash-recovery test
        run: bash scripts/fault_integration_test.sh ./build-faults/versionfs ./build-faults/versionfsctl
