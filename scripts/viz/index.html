<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VersionFS live view</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { --ink:#0a0a0a; --paper:#fafafa; --muted:#6b6b6b; --line:#dcdcdc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 17px/1.45 Inter, system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  header { display: flex; align-items: center; gap: 20px; padding: 22px 40px; border-bottom: 2px solid var(--ink); }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header .session { color: var(--muted); font-size: 15px; }
  .rail { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .rail .s { display: flex; align-items: center; gap: 8px; color: #a0a0a0; font-size: 15px; white-space: nowrap; }
  .rail .s i { font: normal 600 13px "JetBrains Mono", monospace; width: 26px; height: 26px; display: grid; place-items: center; border: 1.5px solid #b5b5b5; border-radius: 50%; }
  .rail .s.done { color: var(--ink); }
  .rail .s.done i { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .rail .s.now { color: var(--ink); font-weight: 600; }
  .rail .s.now i { border: 2.5px solid var(--ink); color: var(--ink); }
  .rail .sep { width: 22px; height: 1.5px; background: #c8c8c8; }
  #next { margin-left: 28px; font: 600 17px Inter, sans-serif; padding: 12px 26px; background: var(--ink); color: var(--paper); border: none; cursor: pointer; min-width: 150px; }
  #next:disabled { background: #d8d8d8; color: #8a8a8a; cursor: default; }
  header .session b { color: var(--ink); }
  .banner { display: none; align-items: baseline; gap: 24px; padding: 20px 40px; background: var(--ink); color: var(--paper); }
  .banner .n { font: 600 14px "JetBrains Mono", monospace; letter-spacing: 2px; color: #a3a3a3; white-space: nowrap; }
  .banner .text { font-size: 26px; font-weight: 600; letter-spacing: -0.3px; }
  main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px; padding: 32px 40px; }
  h2 { font: 600 13px "JetBrains Mono", monospace; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .row { display: grid; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .files .row { grid-template-columns: 1fr auto 230px; }
  .files .name { font: 500 19px "JetBrains Mono", monospace; }
  .files .gone .name { text-decoration: line-through; color: var(--muted); }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; white-space: nowrap; }
  .plan { justify-self: end; font: 600 14px Inter, sans-serif; padding: 5px 12px; background: var(--ink); color: var(--paper); white-space: nowrap; }
  .plan.keep { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .badge { font: 600 13px "JetBrains Mono", monospace; padding: 2px 8px; border: 1.5px solid var(--ink); white-space: nowrap; color: var(--ink); }
  .badge.agent { background: var(--ink); color: var(--paper); }
  .badge.undo { border-style: dashed; }
  .feed .row { grid-template-columns: 76px auto 1fr; font-size: 16px; }
  .feed .t { color: var(--muted); font-size: 14px; }
  .feed .what b { font-family: "JetBrains Mono", monospace; font-weight: 500; }
  .flash { animation: flash 1.8s ease-out; }
  @keyframes flash { from { background: #d6d6d6; } to { background: transparent; } }
  .empty { color: var(--muted); padding: 13px 0; }
</style>
</head>
<body>
<header>
  <h1>VersionFS</h1>
  <span class="session" id="session"></span>
  <div class="rail" id="rail"></div>
  <button id="next" disabled onclick="next()">Next →</button>
</header>
<div class="banner" id="banner"><span class="n" id="banner-n"></span><span class="text" id="banner-text"></span></div>
<main>
  <section class="files">
    <h2 id="files-title">Files</h2>
    <div id="files"></div>
  </section>
  <section class="feed">
    <h2>What happened</h2>
    <div id="feed"></div>
  </section>
</main>
<script>
const seen = { feed: null, files: {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge = w => w ? `<span class="badge ${w.kind}">${esc(w.text)}</span>` : "";
const clock = ns => new Date(ns / 1e6).toLocaleTimeString([], {hour12: false});
const list = ps => ps.length <= 3 ? ps.map(p => `<b>${esc(p)}</b>`).join(", ")
                                  : ps.slice(0, 2).map(p => `<b>${esc(p)}</b>`).join(", ") + ` and ${ps.length - 2} more`;

async function next() {
  const button = document.getElementById("next");
  if (button.disabled) return;
  button.disabled = true;
  await fetch("/api/next", {method: "POST"});
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
});

function render(s) {
  const n = s.step.split("|")[0], current = /^\d/.test(n) ? parseInt(n) : (n === "Done" ? s.steps.length + 1 : 0);
  document.getElementById("rail").innerHTML = s.steps.map((label, i) =>
    `${i ? '<span class="sep"></span>' : ""}<span class="s ${i + 1 < current ? "done" : i + 1 === current ? "now" : ""}"><i>${i + 1}</i>${esc(label)}</span>`).join("");
  const button = document.getElementById("next");
  button.disabled = !s.waiting;
  button.textContent = !s.waiting ? "running…" : current > s.steps.length ? "Finish" : "Next →";
  const banner = document.getElementById("banner");
  if (s.step) {
    const [n, text] = s.step.includes("|") ? s.step.split("|", 2) : ["", s.step];
    document.getElementById("banner-n").textContent = /^\d/.test(n) ? "STEP " + n : n.toUpperCase();
    document.getElementById("banner-text").textContent = text;
    banner.style.display = "flex";
  } else banner.style.display = "none";

  document.getElementById("session").innerHTML = s.session
    ? `session <b>${esc(s.session.label)}</b> · ${esc(s.session.status)}` : "no session yet";
  document.getElementById("files-title").textContent = s.folder ? `Files in ${s.folder}/` : "Files";

  // In the guided demo the per-file undo plan is revealed at the "Preview undo" step.
  const previewAt = s.steps.indexOf("Preview undo") + 1;
  const showPlan = !previewAt || current >= previewAt;
  document.getElementById("files").innerHTML = s.files.length ? s.files.map(f => {
    const key = f.path, sig = f.verb + (f.who ? f.who.text : "") + f.present + f.plan;
    const changed = seen.files[key] !== undefined && seen.files[key] !== sig;
    seen.files[key] = sig;
    const status = f.who ? `${esc(f.verb)} by ${badge(f.who)}` : "unchanged";
    const plan = f.plan && showPlan ? `<span class="plan ${f.plan.startsWith("kept") ? "keep" : ""}">${esc(f.plan)}</span>` : "<span></span>";
    return `<div class="row ${f.present ? "" : "gone"} ${changed ? "flash" : ""}">
      <span class="name">${esc(f.name)}${f.link ? " →" : ""}</span><span class="status">${status}</span>${plan}</div>`;
  }).join("") : `<p class="empty">No files yet.</p>`;

  const top = s.feed.length ? s.feed[0].t + s.feed[0].paths.join() : null;
  document.getElementById("feed").innerHTML = s.feed.length ? s.feed.map((e, i) => {
    const what = e.from ? `${esc(e.verb)} <b>${esc(e.from)}</b> → <b>${esc(e.paths[0])}</b>` : `${esc(e.verb)} ${list(e.paths)}`;
    return `<div class="row ${i === 0 && seen.feed !== null && top !== seen.feed ? "flash" : ""}">
      <span class="t mono">${clock(e.t)}</span>${badge(e.who)}<span class="what">${what}</span></div>`;
  }).join("") : `<p class="empty">Nothing yet.</p>`;
  seen.feed = top;
}

async function tick() {
  try { render(await fetch("/api/state").then(r => r.json())); } catch (e) {}
  setTimeout(tick, 600);
}
tick();
</script>
</body>
</html>
